<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">YOLO-Toys Whitepaper social card</title>
  <desc id="desc">A whitepaper-style social card showing the YOLO-Toys title, subtitle, and runtime architecture motif.</desc>
  <style>
    .bg { fill: #f4eee8; }
    .panel { fill: #fbf8f5; stroke: #d6c7ba; stroke-width: 2; }
    .ink { fill: #2d261f; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .muted { fill: #6f645a; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .accent { fill: #e06c2f; }
    .accent-soft { fill: #f4d6c2; }
    .wire { stroke: #8f7f72; stroke-width: 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #201b17; }
      .panel { fill: #2a231e; stroke: #55463b; }
      .ink { fill: #f2e8de; }
      .muted { fill: #cab9aa; }
      .accent { fill: #ff9b63; }
      .accent-soft { fill: #503222; }
      .wire { stroke: #b99a85; }
    }
  </style>

  <rect class="bg" width="1200" height="630" rx="28" />
  <rect class="panel" x="28" y="28" width="1144" height="574" rx="24" />

  <rect class="accent-soft" x="78" y="84" width="168" height="34" rx="17" />
  <text class="accent" x="102" y="107" font-size="16" font-weight="800" letter-spacing="1.8">YOLO-TOYS WHITEPAPER</text>

  <text class="ink" x="78" y="204" font-size="78" font-weight="820">YOLO-Toys</text>
  <text class="ink" x="78" y="278" font-size="44" font-weight="700">A multi-model vision runtime,</text>
  <text class="ink" x="78" y="328" font-size="44" font-weight="700">documented like an architecture atlas.</text>
  <text class="muted" x="78" y="392" font-size="25">FastAPI, WebSocket, handler adapters, registry dispatch, research-aware docs.</text>

  <rect class="panel" x="720" y="120" width="382" height="360" rx="28" />
  <rect class="accent-soft" x="748" y="148" width="124" height="28" rx="14" />
  <text class="accent" x="770" y="167" font-size="13" font-weight="800" letter-spacing="1.4">RUNTIME MAP</text>

  <rect class="panel" x="748" y="202" width="146" height="78" rx="20" />
  <text class="ink" x="772" y="238" font-size="24" font-weight="760">Ingress</text>
  <text class="muted" x="772" y="260" font-size="14">HTTP and WebSocket</text>

  <rect class="panel" x="936" y="202" width="138" height="78" rx="20" />
  <text class="ink" x="960" y="238" font-size="24" font-weight="760">Control</text>
  <text class="muted" x="960" y="260" font-size="14">manager and cache</text>

  <rect class="panel" x="748" y="332" width="326" height="98" rx="22" />
  <text class="ink" x="772" y="372" font-size="24" font-weight="760">Execution adapters</text>
  <text class="muted" x="772" y="398" font-size="14">YOLO, DETR, OWL-ViT, Grounding DINO, BLIP</text>

  <path class="wire" d="M894 241H936" />
  <path class="wire" d="M1005 280V306H911V332" />

  <text class="muted" x="78" y="540" font-size="22">Read the primer, inspect the architecture atlas, then follow the academy and research chapters.</text>
</svg>
