<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">OWL-ViT Architecture</title>
  <desc id="desc">Open-vocabulary object detection using vision-language pre-training. Text queries are encoded alongside image features to enable detection of arbitrary object categories.</desc>

  <!-- Background -->
  <rect class="canvas" width="1200" height="800" rx="32" />
  <rect class="surface" x="24" y="24" width="1152" height="752" rx="24" stroke-width="2" />

  <!-- Title -->
  <text class="ink" x="72" y="84" font-size="22" font-weight="700" letter-spacing="2">OWL-ViT: OPEN-VOCABULARY DETECTION</text>
  <text class="muted" x="72" y="114" font-size="17">Text-conditioned object detection — detect anything you can describe, no fixed class taxonomy required.</text>

  <!-- Two-tower label -->
  <rect class="brand-soft" x="72" y="140" width="100" height="24" rx="12" />
  <text class="brand" x="80" y="158" font-size="11" font-weight="700" letter-spacing="1">TWO-TOWER</text>

  <!-- ==================== IMAGE TOWER ==================== -->

  <!-- Image Input -->
  <rect class="surface-alt" x="72" y="180" width="140" height="180" rx="16" stroke-width="2" />
  <text class="ink" x="88" y="206" font-size="13" font-weight="700">Image Input</text>
  <rect class="canvas" x="88" y="222" width="108" height="100" rx="8" />
  <text class="muted" x="130" y="260" font-size="11">H × W × 3</text>
  <text class="muted" x="130" y="278" font-size="11">(any size)</text>
  <text class="ink-soft" x="88" y="344" font-size="10">Variable aspect ratio</text>

  <!-- Arrow -->
  <path class="wire" d="M212 270 L260 270" marker-end="url(#arrowhead2)" />

  <!-- Vision Encoder -->
  <rect class="surface-alt" x="260" y="180" width="200" height="180" rx="16" stroke-width="2" />
  <rect class="brand-soft" x="272" y="192" width="120" height="24" rx="12" />
  <text class="ink" x="280" y="210" font-size="11" font-weight="700" letter-spacing="0.5">IMAGE ENCODER</text>

  <text class="ink" x="272" y="246" font-size="15" font-weight="760">ViT-L/14</text>
  <text class="muted" x="272" y="270" font-size="12">Patch embeddings</text>
  <text class="muted" x="272" y="290" font-size="12">+ Positional enc.</text>
  <text class="muted" x="272" y="310" font-size="12">+ Transformer layers</text>

  <rect class="canvas" x="272" y="324" width="176" height="26" rx="8" />
  <text class="ink-soft" x="280" y="342" font-size="11">Output: H' × W' × d</text>

  <!-- Arrow -->
  <path class="wire" d="M460 270 L508 270" marker-end="url(#arrowhead2)" />

  <!-- Image Feature Map -->
  <rect class="surface-alt" x="508" y="200" width="160" height="140" rx="14" stroke-width="1.5" />
  <text class="ink" x="520" y="226" font-size="12" font-weight="700">Image Features</text>
  <rect class="canvas" x="520" y="242" width="136" height="60" rx="8" />
  <text class="muted" x="528" y="268" font-size="11">Spatial feature map</text>
  <text class="muted" x="528" y="288" font-size="11">for detection head</text>
  <text class="ink-soft" x="520" y="320" font-size="10">Per-patch embeddings</text>

  <!-- ==================== TEXT TOWER ==================== -->

  <!-- Text Input -->
  <rect class="surface-alt" x="72" y="440" width="140" height="180" rx="16" stroke-width="2" />
  <text class="ink" x="88" y="466" font-size="13" font-weight="700">Text Query</text>
  <rect class="canvas" x="88" y="482" width="108" height="100" rx="8" />
  <text class="muted" x="100" y="520" font-size="11">"a cat"</text>
  <text class="muted" x="100" y="540" font-size="11">"a dog"</text>
  <text class="muted" x="100" y="560" font-size="11">"red car"</text>
  <text class="ink-soft" x="88" y="604" font-size="10">Natural language</text>

  <!-- Arrow -->
  <path class="wire" d="M212 530 L260 530" marker-end="url(#arrowhead2)" />

  <!-- Text Encoder -->
  <rect class="surface-alt" x="260" y="440" width="200" height="180" rx="16" stroke-width="2" />
  <rect class="accent-soft" x="272" y="452" width="110" height="24" rx="12" />
  <text class="accent-blue" x="280" y="470" font-size="11" font-weight="700" letter-spacing="0.5">TEXT ENCODER</text>

  <text class="ink" x="272" y="506" font-size="15" font-weight="760">Transformer</text>
  <text class="muted" x="272" y="530" font-size="12">Token embeddings</text>
  <text class="muted" x="272" y="550" font-size="12">+ Self-attention</text>
  <text class="muted" x="272" y="570" font-size="12">+ Causal mask</text>

  <rect class="canvas" x="272" y="584" width="176" height="26" rx="8" />
  <text class="ink-soft" x="280" y="602" font-size="11">Output: N × d</text>

  <!-- Arrow -->
  <path class="wire" d="M460 530 L508 530" marker-end="url(#arrowhead2)" />

  <!-- Text Embeddings -->
  <rect class="surface-alt" x="508" y="460" width="160" height="140" rx="14" stroke-width="1.5" />
  <text class="ink" x="520" y="486" font-size="12" font-weight="700">Text Embeddings</text>
  <rect class="canvas" x="520" y="502" width="136" height="60" rx="8" />
  <text class="muted" x="528" y="528" font-size="11">Query embeddings</text>
  <text class="muted" x="528" y="548" font-size="11">for each text input</text>
  <text class="ink-soft" x="520" y="580" font-size="10">Per-query vectors</text>

  <!-- ==================== CONTRASTIVE ALIGNMENT ==================== -->

  <!-- Alignment box -->
  <rect class="surface-alt" x="720" y="260" width="200" height="280" rx="16" stroke-width="2" />
  <rect class="brand-soft" x="732" y="272" width="160" height="24" rx="12" />
  <text class="brand" x="740" y="290" font-size="11" font-weight="700" letter-spacing="0.5">CONTRASTIVE ALIGNMENT</text>

  <text class="ink" x="732" y="326" font-size="13" font-weight="760">CLIP-style Pretrain</text>
  <text class="muted" x="732" y="350" font-size="11">Image-text contrastive</text>
  <text class="muted" x="732" y="368" font-size="11">learning objective</text>

  <rect class="canvas" x="732" y="384" width="176" height="80" rx="10" />
  <text class="ink-soft" x="740" y="406" font-size="11">sim(img, text) =</text>
  <text class="ink-soft" x="740" y="424" font-size="11">  f_img · f_text^T</text>
  <text class="ink-soft" x="740" y="450" font-size="10">Normalized cosine sim</text>

  <text class="muted" x="732" y="490" font-size="11">Shared embedding space</text>
  <text class="muted" x="732" y="510" font-size="11">for images and text</text>

  <!-- ==================== DETECTION HEAD ==================== -->

  <!-- Arrow -->
  <path class="wire" d="M920 400 L968 400" marker-end="url(#arrowhead2)" />

  <!-- Detection Head -->
  <rect class="surface-alt" x="968" y="200" width="180" height="400" rx="16" stroke-width="2" />
  <rect class="brand-soft" x="980" y="212" width="110" height="24" rx="12" />
  <text class="brand" x="988" y="230" font-size="11" font-weight="700" letter-spacing="0.5">DETECTION HEAD</text>

  <!-- Classification -->
  <rect class="canvas" x="980" y="250" width="156" height="100" rx="10" />
  <text class="ink" x="988" y="274" font-size="12" font-weight="700">Classification</text>
  <text class="muted" x="988" y="296" font-size="11">Sigmoid activation</text>
  <text class="muted" x="988" y="314" font-size="11">Per-patch × per-query</text>
  <text class="ink-soft" x="988" y="340" font-size="10">P(class | patch, query)</text>

  <!-- Box Regression -->
  <rect class="canvas" x="980" y="362" width="156" height="100" rx="10" />
  <text class="ink" x="988" y="386" font-size="12" font-weight="700">Box Regression</text>
  <text class="muted" x="988" y="408" font-size="11">Center + Size</text>
  <text class="muted" x="988" y="426" font-size="11">Normalized coords</text>
  <text class="ink-soft" x="988" y="452" font-size="10">(cx, cy, w, h) per patch</text>

  <!-- Output -->
  <text class="ink" x="980" y="490" font-size="12" font-weight="700">Output</text>
  <text class="muted" x="980" y="512" font-size="11">Detections for each</text>
  <text class="muted" x="980" y="530" font-size="11">text query</text>
  <rect class="brand-soft" x="980" y="546" width="156" height="40" rx="10" />
  <text class="brand" x="988" y="572" font-size="11" font-weight="600">{query: [boxes, scores]}</text>

  <!-- ==================== KEY DIFFERENCES ==================== -->

  <rect class="surface-alt" x="72" y="680" width="340" height="80" rx="14" stroke-width="1.5" />
  <text class="ink" x="88" y="708" font-size="13" font-weight="700">vs Traditional Detection</text>
  <text class="muted" x="88" y="730" font-size="11">✗ Fixed class taxonomy (COCO: 80 classes)</text>
  <text class="muted" x="88" y="748" font-size="11">✓ Open vocabulary — any text description</text>

  <rect class="surface-alt" x="432" y="680" width="340" height="80" rx="14" stroke-width="1.5" />
  <text class="ink" x="448" y="708" font-size="13" font-weight="700">vs CLIP Zero-shot</text>
  <text class="muted" x="448" y="730" font-size="11">✗ Whole-image classification only</text>
  <text class="muted" x="448" y="748" font-size="11">✓ Full detection with bounding boxes</text>

  <rect class="surface-alt" x="792" y="680" width="340" height="80" rx="14" stroke-width="1.5" />
  <text class="ink" x="808" y="708" font-size="13" font-weight="700">Performance</text>
  <text class="muted" x="808" y="730" font-size="11">LVIS minival: 31.5 APr (rare classes)</text>
  <text class="muted" x="808" y="748" font-size="11">No training on target classes needed</text>

  <!-- Footer -->
  <text class="muted" x="72" y="780" font-size="14">Minderer et al., "Simple Open-Vocabulary Object Detection with Vision Transformers", ECCV 2022. The key insight: CLIP pretraining transfers to detection when paired with a lightweight detection head.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon class="ink" points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
</svg>
