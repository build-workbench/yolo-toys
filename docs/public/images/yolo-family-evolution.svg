  <text class="muted" x="656" y="666" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Detect → Segment → Pose → Classify</text>

  <rect class="surface-alt" x="960" y="628" width="340" height="48" rx="12" stroke-width="1.2" />
  <text class="accent-blue" x="976" y="650" font-size="12" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif">COCO mAP shown</text>
  <text class="muted" x="976" y="666" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">val2017 @ 640 px input, small-size variant</text>

