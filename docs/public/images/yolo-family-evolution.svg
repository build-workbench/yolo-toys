  <text class="brand" x="754" y="425" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">v4 · 2020</text>
  <text class="ink" x="778" y="456" font-size="17" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLOv4</text>
  <line class="wire" x1="721" y1="464" x2="835" y2="464" stroke-width="1" stroke-dasharray="3 2" />
  <text class="ink-soft" x="721" y="482" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">CSPDarknet-53</text>
  <text class="muted" x="721" y="499" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">PANet + SAM attn</text>
  <text class="muted" x="721" y="516" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Mosaic augment</text>
  <text class="muted" x="721" y="533" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Optimal spd/acc</text>
  <line class="wire" x1="721" y1="543" x2="835" y2="543" stroke-width="1" stroke-dasharray="3 2" />
  <text class="brand" x="721" y="559" font-size="11" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif">62 FPS</text>
  <text class="accent-blue" x="721" y="575" font-size="11" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif">COCO: 43.5 mAP</text>
  <text class="muted" x="721" y="591" font-size="9" font-style="italic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Bochkovskiy et al. 2020</text>
  <text class="muted" x="721" y="606" font-size="9" font-style="italic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Optimal speed/accuracy</text>

  <!-- ─────────────────────────────────────
       YOLOv5 · 2020 · ABOVE
  ───────────────────────────────────────── -->
  <line class="wire" x1="958" y1="338" x2="958" y2="370" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle class="brand" cx="958" cy="370" r="9" />
  <circle class="canvas" cx="958" cy="370" r="4" />
  <rect class="surface-alt" x="887" y="116" width="142" height="222" rx="14" stroke-width="1.5" />
  <rect class="brand-soft" x="895" y="126" width="78" height="22" rx="11" />
  <text class="brand" x="934" y="141" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">v5 · 2020</text>
  <text class="ink" x="958" y="172" font-size="17" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLOv5</text>
  <line class="wire" x1="901" y1="182" x2="1015" y2="182" stroke-width="1" stroke-dasharray="3 2" />
  <text class="ink-soft" x="901" y="200" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">PyTorch-first</text>
  <text class="muted" x="901" y="217" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">AutoAnchor</text>
  <text class="muted" x="901" y="234" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">CSP + SPP head</text>
  <text class="muted" x="901" y="251" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Community adoption</text>
  <line class="wire" x1="901" y1="261" x2="1015" y2="261" stroke-width="1" stroke-dasharray="3 2" />
  <text class="brand" x="901" y="279" font-size="11" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif">140 FPS (s)</text>
  <text class="accent-blue" x="901" y="295" font-size="11" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif">COCO: 37.0 mAP (s)</text>
  <text class="muted" x="901" y="311" font-size="9" font-style="italic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Jocher / Ultralytics 2020</text>

