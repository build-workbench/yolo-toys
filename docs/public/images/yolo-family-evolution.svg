<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="evo-title evo-desc">
  <title id="evo-title">YOLO Family Evolution Timeline</title>
  <desc id="evo-desc">Horizontal timeline showing YOLO object detection evolution from v1 (2016) to v8 (2023), with alternating card layout above and below the spine.</desc>

  <!-- ── Canvas background ── -->
  <rect class="canvas" width="1600" height="700" rx="28" />
  <rect class="surface" x="20" y="20" width="1560" height="660" rx="20" stroke-width="1.5" />

  <!-- ── Header ── -->
  <text class="ink" x="60" y="68" font-size="24" font-weight="800" letter-spacing="3" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLO FAMILY EVOLUTION</text>
  <text class="muted" x="60" y="96" font-size="14" font-family="Inter, ui-sans-serif, system-ui, sans-serif">From grid-based prediction to anchor-free detection (2016–2023)</text>

  <!-- ── Year ruler ── -->
  <!-- 2016 -->
  <text class="muted" x="178" y="385" font-size="11" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">2016</text>
  <!-- 2017 -->
  <text class="muted" x="338" y="385" font-size="11" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">2017</text>
  <!-- 2018 -->
  <text class="muted" x="578" y="385" font-size="11" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">2018</text>
  <!-- 2020 -->
  <text class="muted" x="858" y="385" font-size="11" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">2020</text>
  <!-- 2023 -->
  <text class="muted" x="1378" y="385" font-size="11" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">2023</text>

  <!-- ── Timeline spine ── -->
  <line class="wire" x1="80" y1="370" x2="1520" y2="370" stroke-width="2.5" stroke-dasharray="none" />

  <!-- ══════════════════════════════════════════
       NODE POSITIONS (cx values):
       v1=178  v2=338  v3=578  v4=778  v5=958  v8=1378
       Odd (v1,v3,v5) = ABOVE spine  (cards top ~120, bottom ~340)
       Even (v2,v4)   = BELOW spine  (cards top ~400, bottom ~600)
       v8 special: ABOVE (highlighted)
  ════════════════════════════════════════════ -->

  <!-- ─────────────────────────────────────
       YOLOv1 · 2016 · ABOVE
  ───────────────────────────────────────── -->
  <!-- vertical connector -->
  <line class="wire" x1="178" y1="340" x2="178" y2="370" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- timeline dot -->
  <circle class="brand" cx="178" cy="370" r="9" />
  <circle class="canvas" cx="178" cy="370" r="4" />
  <!-- card -->
  <rect class="surface-alt" x="108" y="116" width="142" height="224" rx="14" stroke-width="1.5" />
  <!-- version badge -->
  <rect class="brand-soft" x="116" y="126" width="78" height="22" rx="11" />
  <text class="brand" x="155" y="141" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">v1 · 2016</text>
  <!-- title -->
  <text class="ink" x="179" y="172" font-size="17" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLOv1</text>
  <!-- divider -->
  <line class="wire" x1="122" y1="182" x2="236" y2="182" stroke-width="1" stroke-dasharray="3 2" />
  <!-- innovation lines -->
  <text class="ink-soft" x="122" y="200" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">7×7 grid prediction</text>
  <text class="muted" x="122" y="217" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">24 conv + 2 FC</text>
  <text class="muted" x="122" y="234" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GoogLeNet base</text>
  <text class="muted" x="122" y="251" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">"You Only Look Once"</text>
  <!-- divider -->
  <line class="wire" x1="122" y1="261" x2="236" y2="261" stroke-width="1" stroke-dasharray="3 2" />
  <!-- stats -->
  <text class="brand" x="122" y="279" font-size="11" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif">45 FPS</text>
  <text class="muted" x="122" y="295" font-size="10" font-family="Inter, ui-sans-serif, system-ui, sans-serif">VOC2007: 63.4 mAP</text>
  <text class="muted" x="122" y="311" font-size="10" font-family="Inter, ui-sans-serif, system-ui, sans-serif">No COCO benchmark</text>
  <!-- "YOLO - You Only Look Once" tag -->
  <text class="muted" x="122" y="330" font-size="9" font-style="italic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Redmon et al. CVPR 2016</text>

  <!-- ─────────────────────────────────────
       YOLOv2 / YOLO9000 · 2016 · BELOW
  ───────────────────────────────────────── -->
  <line class="wire" x1="338" y1="370" x2="338" y2="400" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle class="brand" cx="338" cy="370" r="9" />
  <circle class="canvas" cx="338" cy="370" r="4" />
  <!-- card -->
  <rect class="surface-alt" x="267" y="400" width="142" height="218" rx="14" stroke-width="1.5" />
  <rect class="brand-soft" x="275" y="410" width="88" height="22" rx="11" />
  <text class="brand" x="319" y="425" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">v2 · 2016</text>
  <text class="ink" x="338" y="456" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLO9000</text>
  <line class="wire" x1="281" y1="464" x2="395" y2="464" stroke-width="1" stroke-dasharray="3 2" />
  <text class="ink-soft" x="281" y="482" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Anchor boxes</text>
  <text class="muted" x="281" y="499" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Batch normalisation</text>
  <text class="muted" x="281" y="516" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Darknet-19</text>
  <text class="muted" x="281" y="533" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">9000 classes (WN)</text>
  <line class="wire" x1="281" y1="542" x2="395" y2="542" stroke-width="1" stroke-dasharray="3 2" />
  <text class="brand" x="281" y="558" font-size="11" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif">67 FPS</text>
  <text class="muted" x="281" y="574" font-size="10" font-family="Inter, ui-sans-serif, system-ui, sans-serif">VOC2007: 78.6 mAP</text>
  <text class="muted" x="281" y="590" font-size="9" font-style="italic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Redmon &amp; Farhadi 2017</text>

  <!-- ─────────────────────────────────────
       YOLOv3 · 2018 · ABOVE
  ───────────────────────────────────────── -->
  <line class="wire" x1="578" y1="338" x2="578" y2="370" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle class="brand" cx="578" cy="370" r="9" />
  <circle class="canvas" cx="578" cy="370" r="4" />
  <rect class="surface-alt" x="507" y="116" width="142" height="222" rx="14" stroke-width="1.5" />
  <rect class="brand-soft" x="515" y="126" width="78" height="22" rx="11" />
  <text class="brand" x="554" y="141" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">v3 · 2018</text>
  <text class="ink" x="578" y="172" font-size="17" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLOv3</text>
  <line class="wire" x1="521" y1="182" x2="635" y2="182" stroke-width="1" stroke-dasharray="3 2" />
  <text class="ink-soft" x="521" y="200" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Multi-scale preds</text>
  <text class="muted" x="521" y="217" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">3 detection scales</text>
  <text class="muted" x="521" y="234" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Darknet-53</text>
  <text class="muted" x="521" y="251" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Residual shortcuts</text>
  <line class="wire" x1="521" y1="261" x2="635" y2="261" stroke-width="1" stroke-dasharray="3 2" />
  <text class="brand" x="521" y="279" font-size="11" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif">30 FPS</text>
  <!-- mAP COCO -->
  <text class="accent-blue" x="521" y="295" font-size="11" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif">COCO: 33.0 mAP</text>
  <text class="muted" x="521" y="311" font-size="9" font-style="italic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Redmon &amp; Farhadi 2018</text>

  <!-- ─────────────────────────────────────
       YOLOv4 · 2020 · BELOW
  ───────────────────────────────────────── -->
  <line class="wire" x1="778" y1="370" x2="778" y2="400" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle class="brand" cx="778" cy="370" r="9" />
  <circle class="canvas" cx="778" cy="370" r="4" />
  <rect class="surface-alt" x="707" y="400" width="142" height="224" rx="14" stroke-width="1.5" />
