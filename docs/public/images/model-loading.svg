<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="ml-title ml-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="ml-title">Model Cache Lifecycle</title>
  <desc id="ml-desc">State-machine diagram showing LRU + TTL hybrid cache with memory-pressure eviction for model loading.</desc>

  <!-- ── Canvas ── -->
  <rect class="canvas" width="1400" height="900" rx="0" />

  <!-- ── Outer card ── -->
  <rect class="surface" x="24" y="24" width="1352" height="852" rx="20" stroke-width="1.5" />

  <!-- ════════════════════════════════
       HEADER BAND
  ════════════════════════════════ -->
  <rect class="surface-alt" x="24" y="24" width="1352" height="84" rx="20" />
  <rect class="surface-alt" x="24" y="84" width="1352" height="24" />

  <!-- Title badge -->
  <rect class="brand" x="52" y="44" width="10" height="44" rx="3" />
  <text class="ink" x="74" y="67" font-size="19" font-weight="800" letter-spacing="3">MODEL CACHE LIFECYCLE</text>
  <text class="ink-soft" x="74" y="90" font-size="12" font-weight="400" letter-spacing="0.5">LRU + TTL hybrid with memory-pressure eviction</text>

  <!-- Type pill -->
  <rect class="brand-soft" x="1148" y="52" width="202" height="30" rx="15" />
  <text class="brand" x="1249" y="72" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1">STATE MACHINE</text>

  <!-- ════════════════════════════════
       PERFORMANCE BANNERS
  ════════════════════════════════ -->
  <!-- HIT banner -->
  <g transform="translate(52, 118)">
    <rect class="success" width="310" height="36" rx="8" />
    <text class="canvas" x="16" y="14" font-size="10" font-weight="700" letter-spacing="1">CACHE HIT</text>
    <text class="canvas" x="16" y="28" font-size="12" font-weight="600">4ms – 120ms warm latency</text>
  </g>
  <!-- MISS banner -->
  <g transform="translate(380, 118)">
    <rect class="warning" width="370" height="36" rx="8" />
    <text class="canvas" x="16" y="14" font-size="10" font-weight="700" letter-spacing="1">CACHE MISS</text>
    <text class="canvas" x="16" y="28" font-size="12" font-weight="600">+0.5s (YOLO)  /  +2–10s (HuggingFace)</text>
  </g>

  <!-- ════════════════════════════════
       NODE DEFINITIONS
       Layout:
         [Incoming Request]  col-x=580  y=168
                  ↓
         [ModelCache.get()]  diamond  y=230
           /         \
        HIT           MISS
         ↓              ↓
       [Return       [Security
        Warm]         Check]
         y=360          y=330
                          ↓
                     [Handler._do_load]
                          y=440
                        /      \
                  [YOLO]      [HF path]
                  y=540        y=540
                        \      /
                          ↓
                     [Move to device]
                          y=640
                          ↓
                     [Cache.setitem+TTL]
                          y=720
                          ↓
                     [Return LoadedModel]
                          y=800

       RIGHT: Eviction Policy panel  x=1070  y=280
  ════════════════════════════════ -->

  <!-- ── STEP 0: Incoming Request ── -->
  <g transform="translate(556, 168)">
    <rect class="surface-alt" width="228" height="52" rx="26" stroke-width="2" />
    <text class="ink" x="114" y="22" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1">INCOMING REQUEST</text>
    <text class="ink-soft" x="114" y="40" text-anchor="middle" font-size="12" font-weight="500">model_id: str</text>
  </g>

  <!-- ↓ arrow -->
  <line class="wire" x1="670" y1="220" x2="670" y2="246" stroke-width="2" marker-end="url(#arr)" />

  <!-- ── STEP 1: Cache diamond ── -->
  <!-- diamond centred at 670, 290  (w=200 h=88) -->
  <g transform="translate(670, 290)">
    <polygon class="surface-alt" points="0,-44 110,0 0,44 -110,0" stroke-width="2" />
    <!-- inner border ring via stroke-only polygon -->
    <polygon class="border-strong" points="0,-44 110,0 0,44 -110,0" fill="none" stroke-width="1.5" />
    <text class="ink" x="0" y="-6" text-anchor="middle" font-size="12" font-weight="700">ModelCache</text>
    <text class="ink-soft" x="0" y="10" text-anchor="middle" font-size="11">.get(model_id)</text>
  </g>

  <!-- HIT label + arrow → left branch -->
  <text class="success" x="490" y="286" font-size="11" font-weight="700">HIT</text>
  <path class="wire" d="M 560 290 L 448 290 L 448 360" stroke-width="2" marker-end="url(#arr)" />

  <!-- MISS label + arrow → right branch -->
  <text class="warning" x="786" y="286" font-size="11" font-weight="700">MISS</text>
  <path class="wire" d="M 780 290 L 892 290 L 892 330" stroke-width="2" marker-end="url(#arr)" />


  <!-- ────────────────────
       HIT PATH  (left branch, x≈390)
  ──────────────────── -->

  <!-- Return warm model -->
  <g transform="translate(336, 360)">
    <rect class="success" width="224" height="68" rx="12" />
    <text class="canvas" x="112" y="22" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">RETURN WARM MODEL</text>
    <text class="canvas" x="112" y="40" text-anchor="middle" font-size="13" font-weight="700">Cache HIT ✓</text>
    <text class="canvas" x="112" y="58" text-anchor="middle" font-size="11">Update LRU access time</text>
  </g>

  <!-- arrow down to final output -->
  <line class="wire" x1="448" y1="428" x2="448" y2="790" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" />
  <!-- "fast path" label -->
  <text class="success" x="456" y="620" font-size="10" font-weight="600" letter-spacing="0.5">FAST PATH</text>
  <text class="muted" x="456" y="634" font-size="10">4–120 ms</text>


  <!-- ────────────────────
       MISS PATH  (right branch, x≈892)
  ──────────────────── -->

  <!-- Security Check -->
  <g transform="translate(784, 330)">
    <rect class="surface-alt" width="216" height="72" rx="10" stroke-width="1.5" />
    <rect class="danger" x="0" y="0" width="4" height="72" rx="2" />
    <text class="muted" x="20" y="20" font-size="10" font-weight="600" letter-spacing="1">SECURITY CHECK</text>
    <text class="ink" x="20" y="38" font-size="12" font-weight="700">Path traversal guard</text>
    <text class="ink-soft" x="20" y="54" font-size="11">Forbidden pattern filter</text>
  </g>

  <!-- ↓ arrow -->
  <line class="wire" x1="892" y1="402" x2="892" y2="432" stroke-width="2" marker-end="url(#arr)" />

  <!-- Handler._do_load() -->
  <g transform="translate(774, 432)">
    <rect class="surface-alt" width="236" height="68" rx="10" stroke-width="1.5" />
    <rect class="brand" x="0" y="0" width="4" height="68" rx="2" />
    <text class="muted" x="20" y="20" font-size="10" font-weight="600" letter-spacing="1">DISPATCH</text>
    <text class="ink" x="20" y="38" font-size="13" font-weight="700">Handler._do_load()</text>
    <text class="ink-soft" x="20" y="56" font-size="11">model_id → loader</text>
  </g>

  <!-- branch: YOLO path -->
  <text class="brand" x="732" y="524" font-size="10" font-weight="600">YOLO</text>
  <path class="wire" d="M 774 500 L 720 500 L 720 540" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- branch: HF path -->
  <text class="accent-blue" x="960" y="524" font-size="10" font-weight="600">HF</text>
  <path class="wire" d="M 1010 500 L 1062 500 L 1062 540" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- YOLO loader box -->
  <g transform="translate(624, 540)">
    <rect class="surface-alt" width="192" height="80" rx="10" stroke-width="1.5" />
    <rect class="brand" x="0" y="0" width="192" height="28" rx="10" />
    <rect class="brand" x="0" y="18" width="192" height="10" />
    <text class="canvas" x="96" y="19" text-anchor="middle" font-size="11" font-weight="700">YOLO PATH</text>
    <text class="ink-soft" x="14" y="46" font-size="11">ultralytics.YOLO(</text>
    <text class="ink-soft" x="14" y="60" font-size="11">  model_id)</text>
    <text class="muted" x="14" y="75" font-size="10">local .pt file</text>
  </g>

  <!-- HF loader box -->
  <g transform="translate(970, 540)">
    <rect class="surface-alt" width="192" height="80" rx="10" stroke-width="1.5" />
    <rect class="accent-blue" x="0" y="0" width="192" height="28" rx="10" />
    <rect class="accent-blue" x="0" y="18" width="192" height="10" />
    <text class="canvas" x="96" y="19" text-anchor="middle" font-size="11" font-weight="700">HF PATH</text>
    <text class="ink-soft" x="14" y="46" font-size="11">from_pretrained(</text>
    <text class="ink-soft" x="14" y="60" font-size="11">  model_id)</text>
    <text class="muted" x="14" y="75" font-size="10">HuggingFace Hub</text>
  </g>

  <!-- merge lines down to Move to device -->
  <path class="wire" d="M 720 620 L 720 658 L 830 658" stroke-width="1.5" marker-end="url(#arr)" />
  <path class="wire" d="M 1062 620 L 1062 658 L 970 658" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Move to device -->
  <g transform="translate(830, 638)">
    <rect class="surface-alt" width="240" height="52" rx="10" stroke-width="1.5" />
    <rect class="brand" x="0" y="0" width="4" height="52" rx="2" />
    <text class="muted" x="20" y="18" font-size="10" font-weight="600" letter-spacing="1">DEVICE PLACEMENT</text>
    <text class="ink" x="20" y="36" font-size="12" font-weight="700">model.to(device)  CPU / CUDA</text>
  </g>

  <!-- ↓ arrow -->
  <line class="wire" x1="950" y1="690" x2="950" y2="718" stroke-width="2" marker-end="url(#arr)" />

  <!-- Cache.setitem with TTL -->
  <g transform="translate(830, 718)">
    <rect class="surface-alt" width="240" height="62" rx="10" stroke-width="1.5" />
    <rect class="brand" x="0" y="0" width="4" height="62" rx="2" />
    <text class="muted" x="20" y="18" font-size="10" font-weight="600" letter-spacing="1">CACHE WRITE</text>
    <text class="ink" x="20" y="36" font-size="12" font-weight="700">Cache.__setitem__(model_id)</text>
    <text class="ink-soft" x="20" y="52" font-size="11">TTL stamp + LRU insertion</text>
  </g>

  <!-- converge to Return LoadedModel -->
  <path class="wire" d="M 950 780 L 950 820 L 730 820" stroke-width="2" marker-end="url(#arr)" />

  <!-- Return LoadedModel (final) -->
  <g transform="translate(502, 790)">
    <rect class="brand" width="228" height="52" rx="26" />
    <text class="canvas" x="114" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1">RETURN LOADED MODEL</text>
    <text class="canvas" x="114" y="40" text-anchor="middle" font-size="12" font-weight="600">LoadedModel.infer()</text>
  </g>


  <!-- ════════════════════════════════
       RIGHT PANEL — EVICTION POLICY
  ════════════════════════════════ -->

  <!-- panel card -->
  <g transform="translate(1094, 168)">
    <rect class="surface-alt" width="270" height="498" rx="14" stroke-width="1.5" />
    <rect class="danger" x="0" y="0" width="270" height="36" rx="14" />
    <rect class="danger" x="0" y="24" width="270" height="12" />
    <text class="canvas" x="135" y="24" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1">EVICTION POLICY</text>

    <!-- TTL block -->
    <rect class="surface" x="14" y="50" width="242" height="84" rx="8" stroke-width="1" />
    <rect class="warning" x="14" y="50" width="4" height="84" rx="2" />
    <text class="muted" x="28" y="68" font-size="10" font-weight="600" letter-spacing="1">TRIGGER 1 — TTL</text>
    <text class="ink" x="28" y="85" font-size="12" font-weight="700">TTL expired</text>
    <text class="ink-soft" x="28" y="101" font-size="11">entry.timestamp + ttl_seconds</text>
    <text class="ink-soft" x="28" y="116" font-size="11">&lt; now()  →  evict immediately</text>

    <!-- LRU block -->
    <rect class="surface" x="14" y="148" width="242" height="84" rx="8" stroke-width="1" />
    <rect class="warning" x="14" y="148" width="4" height="84" rx="2" />
    <text class="muted" x="28" y="166" font-size="10" font-weight="600" letter-spacing="1">TRIGGER 2 — MEMORY</text>
    <text class="ink" x="28" y="183" font-size="12" font-weight="700">memory &gt; 85 %</text>
    <text class="ink-soft" x="28" y="199" font-size="11">psutil.virtual_memory().percent</text>
    <text class="ink-soft" x="28" y="214" font-size="11">→  LRU evict oldest entry</text>

    <!-- CUDA block -->
    <rect class="surface" x="14" y="246" width="242" height="68" rx="8" stroke-width="1" />
    <rect class="danger" x="14" y="246" width="4" height="68" rx="2" />
    <text class="muted" x="28" y="264" font-size="10" font-weight="600" letter-spacing="1">POST-EVICT</text>
    <text class="ink" x="28" y="281" font-size="12" font-weight="700">cuda.empty_cache()</text>
    <text class="ink-soft" x="28" y="297" font-size="11">Release GPU VRAM fragment</text>

    <!-- capacity note -->
    <rect class="surface" x="14" y="328" width="242" height="52" rx="8" stroke-width="1" />
    <text class="muted" x="28" y="346" font-size="10" font-weight="600" letter-spacing="1">CAPACITY</text>
    <text class="ink-soft" x="28" y="362" font-size="11">max_size: int  (config, default 5)</text>
    <text class="ink-soft" x="28" y="375" font-size="11">Size limit triggers LRU evict</text>

    <!-- order note -->
    <rect class="surface" x="14" y="394" width="242" height="52" rx="8" stroke-width="1" />
    <text class="muted" x="28" y="412" font-size="10" font-weight="600" letter-spacing="1">ORDER OF CHECKS</text>
    <text class="ink-soft" x="28" y="428" font-size="11">1. TTL  →  2. size  →  3. memory %</text>
    <text class="ink-soft" x="28" y="442" font-size="11">All checked on every cache write</text>
  </g>


  <!-- ════════════════════════════════
       LEGEND (bottom-left)
  ════════════════════════════════ -->
  <g transform="translate(52, 158)">
    <rect class="surface-alt" width="260" height="148" rx="10" stroke-width="1" />
    <text class="muted" x="14" y="22" font-size="10" font-weight="600" letter-spacing="1">LEGEND</text>

    <!-- hit -->
    <rect class="success" x="14" y="32" width="12" height="12" rx="3" />
    <text class="ink-soft" x="34" y="43" font-size="11">Cache HIT — warm path</text>

    <!-- miss -->
    <rect class="warning" x="14" y="52" width="12" height="12" rx="3" />
    <text class="ink-soft" x="34" y="63" font-size="11">Cache MISS — cold load path</text>

    <!-- yolo -->
    <rect class="brand" x="14" y="72" width="12" height="12" rx="3" />
    <text class="ink-soft" x="34" y="83" font-size="11">YOLO loader (ultralytics)</text>

    <!-- hf -->
    <rect class="accent-blue" x="14" y="92" width="12" height="12" rx="3" />
    <text class="ink-soft" x="34" y="103" font-size="11">HuggingFace loader</text>

    <!-- evict -->
    <rect class="danger" x="14" y="112" width="12" height="12" rx="3" />
    <text class="ink-soft" x="34" y="123" font-size="11">Eviction / danger path</text>

    <!-- dashed = fast -->
    <line class="wire" x1="14" y1="138" x2="26" y2="138" stroke-width="2" stroke-dasharray="4 3" />
    <text class="ink-soft" x="34" y="143" font-size="11">Dashed = fast / skip path</text>
  </g>


  <!-- ════════════════════════════════
       FOOTER
  ════════════════════════════════ -->
  <line class="border" x1="24" y1="852" x2="1376" y2="852" stroke-width="1" />
  <text class="muted-soft" x="52" y="870" font-size="10">Hybrid TTL + LRU cache ensures freshness and memory efficiency. GPU VRAM is released via cuda.empty_cache() on each eviction.</text>
  <text class="muted-soft" x="52" y="884" font-size="10">All thresholds are configurable at startup via environment variables (MAX_CACHE_SIZE, MODEL_TTL_SECONDS, MEMORY_THRESHOLD_PCT).</text>


  <!-- ════════════════════════════════
       DEFS — arrowhead marker
  ════════════════════════════════ -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="wire" points="0 0, 8 3, 0 6" stroke="none" />
    </marker>
  </defs>
</svg>
