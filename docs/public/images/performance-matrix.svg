<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="pm-title pm-desc">
  <title id="pm-title">Performance Matrix – Cold-start vs Warm-start Latency</title>
  <desc id="pm-desc">Horizontal bar chart comparing CPU and GPU cold-start versus warm-start latency across five model families: YOLOv8n, YOLOv8m, DETR, OWL-ViT, and BLIP. Demonstrates ModelCache value.</desc>

  <!-- ── Canvas + surface ── -->
  <rect class="canvas" width="1400" height="860" rx="28" />
  <rect class="surface" x="20" y="20" width="1360" height="820" rx="20" stroke-width="1.5" />

  <!-- ── Header ── -->
  <text class="ink" x="60" y="68" font-size="24" font-weight="800" letter-spacing="3" font-family="Inter, ui-sans-serif, system-ui, sans-serif">PERFORMANCE MATRIX</text>
  <text class="muted" x="60" y="96" font-size="14" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Cold-start vs warm-start latency across model families (log scale)</text>

  <!-- ════════════════════════════════════
       LAYOUT CONSTANTS (comments only)
       X-axis: x=300 (left edge) → x=1310 (right edge) = 1010 px wide
       log10 domain: 0.602 (4 ms) → 4.000 (10 000 ms)
       px_per_log_unit = 1010 / (4.000 - 0.602) = 1010 / 3.398 ≈ 297.2

       helper: x(ms) = 300 + (log10(ms) - 0.602) * 297.2

       4    → 300
       10   → 388
       18   → 442
       65   → 535
       70   → 540
       90   → 553
       110  → 564
       120  → 568
       280  → 621
       380  → 633
       420  → 636
       450  → 639
       550  → 648
       950  → 678
       1100 → 683
       1820 → 714
       2100 → 720
       3800 → 753
       4200 → 757
       10000 → 1310
  ════════════════════════════════════ -->

  <!-- ── X-axis log scale tick labels ── -->
  <!-- baseline at y=136 for first model group -->
  <text class="muted" x="297" y="148" font-size="10" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">4ms</text>
  <text class="muted" x="388" y="148" font-size="10" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">10ms</text>
  <text class="muted" x="596" y="148" font-size="10" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">100ms</text>
  <text class="muted" x="893" y="148" font-size="10" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">1 s</text>
  <text class="muted" x="1190" y="148" font-size="10" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">10 s</text>

  <!-- x-axis gridlines (full height, dashed, light) -->
  <line class="wire" x1="300" y1="155" x2="300" y2="780" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
  <line class="wire" x1="388" y1="155" x2="388" y2="780" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" />
  <line class="wire" x1="596" y1="155" x2="596" y2="780" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
  <line class="wire" x1="893" y1="155" x2="893" y2="780" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" />
  <line class="wire" x1="1190" y1="155" x2="1190" y2="780" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />

  <!-- x-axis baseline -->
  <line class="wire" x1="300" y1="780" x2="1310" y2="780" stroke-width="1.5" />
  <!-- x-axis label -->
  <text class="muted" x="805" y="800" font-size="12" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Latency (log scale, ms) →</text>

  <!-- ── Y-axis model labels ── -->
  <!-- 5 models × 120 px row height, starting y=175 -->
  <!-- Row centres: 215, 335, 455, 575, 695 -->

  <!-- ════════════════════════════════════
       ROW 1: YOLOv8n  (row top=175, centre=215)
       CPU Warm:  18 ms  → bar x=300, w=442-300=142
       CPU Cold: 450 ms  → bar x=300, w=639-300=339
       GPU Warm:   4 ms  → dot x=300
       GPU Cold: 120 ms  → dot x=568
  ════════════════════════════════════ -->
  <text class="ink" x="280" y="208" font-size="13" font-weight="700" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLOv8n</text>
  <text class="muted" x="280" y="224" font-size="10" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">nano</text>

  <!-- CPU Warm bar -->
  <rect class="accent-blue" x="300" y="175" width="142" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="449" y="191" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 18ms</text>
  <!-- CPU Cold bar -->
  <rect class="brand" x="300" y="202" width="339" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="645" y="218" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 450ms</text>
  <!-- GPU Warm dot (x=300 = 4ms) -->
  <circle class="accent-blue" cx="300" cy="240" r="6" />
  <text class="muted" x="308" y="244" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Warm 4ms</text>
  <!-- GPU Cold diamond (x=568 = 120ms) -->
  <rect class="brand-soft" x="562" y="232" width="12" height="12" rx="2" transform="rotate(45 568 238)" />
  <text class="muted" x="578" y="244" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Cold 120ms</text>

  <!-- speedup badge -->
  <rect class="surface-alt" x="1000" y="187" width="128" height="24" rx="12" stroke-width="1" />
  <text class="warning" x="1064" y="204" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">25× cold penalty</text>

  <!-- row separator -->
  <line class="wire" x1="60" y1="260" x2="1340" y2="260" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

  <!-- ════════════════════════════════════
       ROW 2: YOLOv8m  (centre=335)
       CPU Warm:  65ms  → w=535-300=235
       CPU Cold: 1820ms → w=714-300=414
       GPU Warm:  12ms  → x=355
       GPU Cold: 380ms  → x=633
  ════════════════════════════════════ -->
  <text class="ink" x="280" y="328" font-size="13" font-weight="700" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">YOLOv8m</text>
  <text class="muted" x="280" y="344" font-size="10" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">medium</text>

  <rect class="accent-blue" x="300" y="295" width="235" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="541" y="311" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 65ms</text>

  <rect class="brand" x="300" y="322" width="414" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="720" y="338" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 1820ms</text>

  <circle class="accent-blue" cx="355" cy="360" r="6" />
  <text class="muted" x="363" y="364" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Warm 12ms</text>
  <rect class="brand-soft" x="627" y="352" width="12" height="12" rx="2" transform="rotate(45 633 358)" />
  <text class="muted" x="643" y="364" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Cold 380ms</text>

  <rect class="surface-alt" x="1000" y="307" width="128" height="24" rx="12" stroke-width="1" />
  <text class="warning" x="1064" y="324" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">28× cold penalty</text>

  <line class="wire" x1="60" y1="380" x2="1340" y2="380" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

  <!-- ════════════════════════════════════
       ROW 3: DETR  (centre=455)
       CPU Warm:  380ms → w=633-300=333
       CPU Cold: 4200ms → w=757-300=457
       GPU Warm:   90ms → x=553
       GPU Cold: 1100ms → x=683
  ════════════════════════════════════ -->
  <text class="ink" x="280" y="448" font-size="13" font-weight="700" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">DETR</text>
  <text class="muted" x="280" y="464" font-size="10" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">transformer</text>

  <rect class="accent-blue" x="300" y="415" width="333" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="639" y="431" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 380ms</text>

  <rect class="brand" x="300" y="442" width="457" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="763" y="458" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 4200ms</text>

  <circle class="accent-blue" cx="553" cy="480" r="6" />
  <text class="muted" x="561" y="484" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Warm 90ms</text>
  <rect class="brand-soft" x="677" y="472" width="12" height="12" rx="2" transform="rotate(45 683 478)" />
  <text class="muted" x="693" y="484" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Cold 1100ms</text>

  <rect class="surface-alt" x="1000" y="427" width="128" height="24" rx="12" stroke-width="1" />
  <text class="danger" x="1064" y="444" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">11× cold penalty</text>

  <line class="wire" x1="60" y1="500" x2="1340" y2="500" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

  <!-- ════════════════════════════════════
       ROW 4: OWL-ViT  (centre=575)
       CPU Warm:  420ms → w=636-300=336
       CPU Cold: 3800ms → w=753-300=453
       GPU Warm:  110ms → x=564
       GPU Cold:  950ms → x=678
  ════════════════════════════════════ -->
  <text class="ink" x="280" y="568" font-size="13" font-weight="700" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">OWL-ViT</text>
  <text class="muted" x="280" y="584" font-size="10" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">open-vocab</text>

  <rect class="accent-blue" x="300" y="535" width="336" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="642" y="551" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 420ms</text>

  <rect class="brand" x="300" y="562" width="453" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="759" y="578" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 3800ms</text>

  <circle class="accent-blue" cx="564" cy="600" r="6" />
  <text class="muted" x="572" y="604" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Warm 110ms</text>
  <rect class="brand-soft" x="672" y="592" width="12" height="12" rx="2" transform="rotate(45 678 598)" />
  <text class="muted" x="688" y="604" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Cold 950ms</text>

  <rect class="surface-alt" x="1000" y="547" width="128" height="24" rx="12" stroke-width="1" />
  <text class="danger" x="1064" y="564" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">9× cold penalty</text>

  <line class="wire" x1="60" y1="620" x2="1340" y2="620" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

  <!-- ════════════════════════════════════
       ROW 5: BLIP  (centre=695)
       CPU Warm:  280ms → w=621-300=321
       CPU Cold: 2100ms → w=720-300=420
       GPU Warm:   70ms → x=540
       GPU Cold:  550ms → x=648
  ════════════════════════════════════ -->
  <text class="ink" x="280" y="688" font-size="13" font-weight="700" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">BLIP</text>
  <text class="muted" x="280" y="704" font-size="10" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, sans-serif">vision-language</text>

  <rect class="accent-blue" x="300" y="655" width="321" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="627" y="671" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 280ms</text>

  <rect class="brand" x="300" y="682" width="420" height="22" rx="4" opacity="0.85" />
  <text class="ink" x="726" y="698" font-size="10" font-weight="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif"> 2100ms</text>

  <circle class="accent-blue" cx="540" cy="720" r="6" />
  <text class="muted" x="548" y="724" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Warm 70ms</text>
  <rect class="brand-soft" x="642" y="712" width="12" height="12" rx="2" transform="rotate(45 648 718)" />
  <text class="muted" x="658" y="724" font-size="9" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Cold 550ms</text>

  <rect class="surface-alt" x="1000" y="667" width="128" height="24" rx="12" stroke-width="1" />
  <text class="warning" x="1064" y="684" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">7.5× cold penalty</text>

  <!-- ════════════════════════════════════
       LEGEND
  ════════════════════════════════════ -->
  <rect class="surface-alt" x="60" y="750" width="620" height="56" rx="14" stroke-width="1.2" />
  <!-- CPU Warm swatch -->
  <rect class="accent-blue" x="80" y="769" width="28" height="12" rx="3" opacity="0.85" />
  <text class="ink-soft" x="114" y="780" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">CPU Warm start</text>
  <!-- CPU Cold swatch -->
  <rect class="brand" x="246" y="769" width="28" height="12" rx="3" opacity="0.85" />
  <text class="ink-soft" x="280" y="780" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">CPU Cold start</text>
  <!-- GPU Warm dot -->
  <circle class="accent-blue" cx="94" cy="798" r="6" />
  <text class="ink-soft" x="106" y="802" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Warm start</text>
  <!-- GPU Cold diamond -->
  <rect class="brand-soft" x="248" y="790" width="12" height="12" rx="2" transform="rotate(45 254 796)" />
  <text class="ink-soft" x="266" y="802" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">GPU Cold start</text>
  <!-- bar length note -->
  <text class="muted" x="430" y="780" font-size="10" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Bar length = log₁₀(ms)</text>
  <text class="muted" x="430" y="796" font-size="10" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Scale: 4 ms → 10 000 ms</text>

  <!-- ════════════════════════════════════
       KEY INSIGHT CALLOUT
  ════════════════════════════════════ -->
  <rect class="surface-alt" x="700" y="745" width="620" height="68" rx="14" stroke-width="1.5" />
  <!-- accent left stripe -->
  <rect class="brand" x="700" y="745" width="6" height="68" rx="3" />
  <text class="brand" x="720" y="768" font-size="13" font-weight="800" font-family="Inter, ui-sans-serif, system-ui, sans-serif">KEY INSIGHT</text>
  <text class="ink-soft" x="720" y="787" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Cache miss penalty: 10–40× warm latency</text>
  <text class="muted" x="720" y="804" font-size="11" font-family="Inter, ui-sans-serif, system-ui, sans-serif">ModelCache eliminates cold starts → P95 ≈ warm latency</text>

  <!-- ModelCache value annotation – arrow pointing to gap between bars -->
  <!-- dashed bracket from v8n cold bar end to warm bar end -->
  <line class="success" x1="442" y1="165" x2="639" y2="165" stroke-width="2" stroke-dasharray="5 3" />
  <line class="success" x1="442" y1="161" x2="442" y2="169" stroke-width="2" />
  <line class="success" x1="639" y1="161" x2="639" y2="169" stroke-width="2" />
  <text class="success" x="540" y="160" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif">ModelCache saves this gap</text>

</svg>
